[package]
name = "w3c-rs"
version = "0.1.0"
edition = "2024"
description = "Reader and writer for Warcraft III camera files (war3map.w3c)"
license = "CC0-1.0"

[[bin]]
name = "w3c-rs"
path = "src/main.rs"

[lib]
name = "w3c_rs"
path = "src/lib.rs"

[dependencies]
parser-rs = { path = "../parser-rs" }
bni-rs = { path = "../bni-rs" }
